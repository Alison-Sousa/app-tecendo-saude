[build]
  command = "node env/build-env.js"
  publish = "."

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/env/env.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
