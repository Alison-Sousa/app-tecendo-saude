<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Tecendo Saúde</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#f0f9f2 0%,#e0f3e5 40%,#d5f0dc 100%);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.logo{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#e8f5e9);box-shadow:0 8px 40px rgba(47,107,63,0.18),0 0 0 8px rgba(47,107,63,0.06);display:flex;align-items:center;justify-content:center;animation:pulse 2s ease-in-out infinite;overflow:hidden}
.logo img{width:90px;height:90px;object-fit:contain}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 8px 40px rgba(47,107,63,0.18),0 0 0 8px rgba(47,107,63,0.06)}50%{transform:scale(1.04);box-shadow:0 12px 50px rgba(47,107,63,0.25),0 0 0 14px rgba(47,107,63,0.04)}}
.title{margin-top:28px;font-size:28px;font-weight:800;color:#2f6b3f;letter-spacing:3px;animation:fadeUp .8s ease-out .2s both}
.subtitle{margin-top:8px;font-size:13px;font-weight:500;color:#64856e;letter-spacing:.5px;animation:fadeUp .8s ease-out .5s both}
.dots{margin-top:36px;display:flex;gap:8px;animation:fadeUp .8s ease-out .8s both}
.dots span{width:8px;height:8px;border-radius:50%;background:#2f6b3f;animation:bounce 1.4s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1.2);opacity:1}}
</style>
</head>
<body>
<div class="logo"><img src="img/logo.png" alt="Tecendo Saúde"/></div>
<div class="title">TECENDO SAÚDE</div>
<div class="subtitle">Cuidado Integral à Saúde na Amazônia</div>
<div class="dots"><span></span><span></span><span></span></div>
<script>
document.addEventListener('deviceready', function() {
  if (navigator.splashscreen) navigator.splashscreen.hide();
  setTimeout(function() {
    window.location.replace('https://app-tecendo.netlify.app/');
  }, 800);
}, false);
// Fallback if deviceready never fires (web browser)
setTimeout(function() {
  window.location.replace('https://app-tecendo.netlify.app/');
}, 3000);
</script>
<script src="cordova.js"></script>
</body>
</html>
