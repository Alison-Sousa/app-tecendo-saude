<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --primary: #2f6b3f; --primary-light: #3a8550; --accent: #d8a43a; --accent2: #c96f3a; --bg: #f0f7f2; --text: #1f2a44; --card-bg: #fff; --border: #dce5df; --border-focus: #2f6b3f; --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02); --shadow-md: 0 4px 16px rgba(47,107,63,0.08); --shadow-lg: 0 8px 30px rgba(47,107,63,0.12); --radius: 14px; --radius-sm: 10px; }
  body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text); margin: 0; -webkit-tap-highlight-color: transparent; }
  .fade-in { animation: fadeIn 0.35s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .btn-primary { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--primary) 0%, #1b4d28 100%); color: #fff; border-radius: var(--radius); font-weight: 800; font-size: 16px; border: none; cursor: pointer; box-shadow: 0 4px 14px rgba(47,107,63,0.35); display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.15s, box-shadow 0.15s; letter-spacing: 0.3px; }
  .btn-primary:active { transform: scale(0.97); box-shadow: 0 2px 6px rgba(47,107,63,0.15); }
  .btn-sec { width: 100%; padding: 14px; background: var(--card-bg); color: #475569; border: 1.5px solid var(--border); border-radius: var(--radius); font-weight: 700; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
  .btn-sec:active { background: #f8faf9; border-color: var(--primary); }

  .input-box, select, textarea { width: 100%; padding: 14px 16px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--card-bg); font-size: 15px; outline: none; margin-bottom: 10px; appearance: none; transition: border-color 0.2s, box-shadow 0.2s; font-family: inherit; color: var(--text); }
  .input-box:focus, select:focus, textarea:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(47,107,63,0.12); }
  .input-box::placeholder { color: #b0bcc5; }

  .card { background: var(--card-bg); padding: 18px; border-radius: 16px; box-shadow: var(--shadow-sm); margin-bottom: 14px; border: 1px solid rgba(47,107,63,0.06); transition: box-shadow 0.2s; }

  .section-title { font-size: 11.5px; font-weight: 800; color: var(--primary); text-transform: uppercase; margin: 28px 0 10px 0; letter-spacing: 1.2px; padding-left: 10px; border-left: 3px solid var(--primary); line-height: 1; }

  .loading { position: fixed; inset: 0; background: rgba(240,247,242,0.95); z-index: 99; display: flex; align-items: center; justify-content: center; flex-direction: column; font-weight: 700; color: var(--primary); backdrop-filter: blur(4px); }
  .thumb { width: 64px; height: 64px; border-radius: var(--radius-sm); background: #f0f7f2; display: flex; align-items: center; justify-content: center; border: 1.5px dashed var(--border); font-size: 24px; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
  .thumb:active { border-color: var(--primary); background: #e6f2ea; }
  .big-btn { width: 100%; padding: 28px 20px; background: var(--card-bg); border-radius: 20px; border: 1.5px solid #e2e8f0; display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer; box-shadow: var(--shadow-sm); margin-bottom: 16px; transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s; }
  .big-btn:active { box-shadow: var(--shadow-md); border-color: var(--primary); transform: scale(0.98); }
  .big-btn-icon { font-size: 32px; background: linear-gradient(135deg, #dcfce7, #bbf7d0); width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .hidden-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 10; }
</style>
</head>

  <div style="width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#e8f5e9);box-shadow:0 6px 30px rgba(47,107,63,0.15);display:flex;align-items:center;justify-content:center;"><img src="../img/logo.png" style="width:65px;height:65px;object-fit:contain;" /></div>
  <div style="margin-top:18px;font-size:20px;font-weight:800;color:#2f6b3f;letter-spacing:2px;">TECENDO SAÚDE</div>

<script type="text/babel">
// ================================================
// COMPONENTES DO PROFISSIONAL
// ================================================

// Helpers de tipo profissional
const getTipoFromHash = () => {
  const hash = window.location.hash;
  if (hash === '#equipe_ubs' || hash === '#profissional-equipe_ubs') return 'equipe_ubs';
  if (hash === '#tecnico_enfermagem' || hash === '#profissional-tecnico_enfermagem') return 'tecnico_enfermagem';
  if (hash === '#gerente_unidade' || hash === '#profissional-gerente_unidade') return 'gerente_unidade';
  if (hash === '#coordenador_ab' || hash === '#profissional-coordenador_ab') return 'coordenador_ab';
  if (hash === '#profissional-telessaude') return 'telessaude';
  return 'acs';
};
const tipoProfissionalLabel = (tipo) => tipo === 'telessaude' ? 'Telessaúde' : tipo === 'equipe_ubs' ? 'Profissional de Saúde' : tipo === 'tecnico_enfermagem' ? 'Técnico de Enfermagem' : tipo === 'gerente_unidade' ? 'Gerente de Unidade' : (tipo === 'coordenador_ab' || String(tipo || '').startsWith('coord')) ? 'Coordenador de Atenção Básica' : 'ACS';
const tipoProfissionalStyle = (tipo) => tipo === 'telessaude' ? {bg:'#e0e7ff', background:'#e0e7ff', color:'#4338ca'} : tipo === 'equipe_ubs' ? {bg:'#fff7ed', background:'#fff7ed', color:'#c2410c'} : tipo === 'tecnico_enfermagem' ? {bg:'#ecfeff', background:'#ecfeff', color:'#0e7490'} : tipo === 'gerente_unidade' ? {bg:'#fef9c3', background:'#fef9c3', color:'#854d0e'} : (tipo === 'coordenador_ab' || String(tipo || '').startsWith('coord')) ? {bg:'#f3e8ff', background:'#f3e8ff', color:'#7e22ce'} : {bg:'#dcfce7', background:'#dcfce7', color:'#166534'};
// Autenticação do profissional
const ProAuth = ({onAuth, onBack}) => {
  const [step, setStep] = useState('cpf');
  const [cpf, setCpf] = useState('');
  const [reg, setReg] = useState({nome:'', cpf:'', municipio:'', ubs:'', telefone:'', tipo: getTipoFromHash()});
  const [loading, setLoading] = useState(false);
  const [msg, setMsg] = useState('');
  const [tipoSelecionado, setTipoSelecionado] = useState(getTipoFromHash());
  
  const checkCpf = async () => {
    if(!cpf) return alert('Digite o CPF');
    const clean = cpf.replace(/\D/g,'');
    if(clean.length !== 11) return alert('CPF inválido');
    setLoading(true);
    try {
      const { data: pro } = await supabase.from('profissionais').select('*').eq('cpf', clean).maybeSingle();
      if(pro){ onAuth({...pro, tipo: pro.tipo || 'acs'}); setLoading(false); return; }
      // Not a professional — check if exists as patient
      const { data: paciente } = await supabase.from('perfis').select('cpf').eq('cpf', clean).maybeSingle();
      if(paciente){
        setMsg('Este CPF pertence a um usuário do SUS. Acesso profissional não permitido.');
        setLoading(false);
        return;
      }
      // Not found anywhere — allow registration
      setReg(r=>({...r, cpf: mascaraCPF(clean), tipo: tipoSelecionado}));
      setStep('register');
      setMsg('CPF não encontrado. Complete seu cadastro como profissional.');
    } catch { setReg(r=>({...r, cpf: mascaraCPF(clean), tipo: tipoSelecionado})); setStep('register'); setMsg('Offline ou erro. Cadastre-se.'); }
    setLoading(false);
  };
  
  const register = async () => {
    if(!reg.municipio || !reg.ubs || !reg.nome || !reg.telefone) return alert('Preencha todos os campos');
    if(reg.municipio === 'Outro') return alert('Informe qual município de atuação.');
    if(reg.ubs === 'Outro') return alert('Informe qual UBS de atuação.');
    setLoading(true);
    try {
      const cpfClean = reg.cpf.replace(/\D/g,'');
      const payload = { nome: reg.nome, cpf: cpfClean, municipio: reg.municipio, ubs: reg.ubs, telefone: reg.telefone, tipo: reg.tipo || tipoSelecionado };
      const { data, error } = await supabase.from('profissionais').insert(payload).select().maybeSingle();
      if(error){ alert('Erro ao cadastrar: ' + error.message); }
      else { alert('Cadastrado com sucesso!'); onAuth({...data, tipo: data.tipo || tipoSelecionado}); }
    } catch(e) { alert('Falha de rede: ' + e.message); }
    setLoading(false);
  };
  
  if(loading) return <Loading text="Verificando..." />;
  
  if(step==='register') return (
    <div className="p-6 fade-in">
      <h2 className="text-2xl font-bold mb-2">Cadastro Profissional</h2>
      <div className="mb-4"><span style={{display:'inline-block', padding:'4px 12px', borderRadius:'20px', fontSize:'12px', fontWeight:800, ...tipoProfissionalStyle(reg.tipo)}}>{tipoProfissionalLabel(reg.tipo)}</span></div>
      <p className="text-gray-500 mb-4">CPF <strong>{reg.cpf}</strong> não encontrado</p>
      {msg && <div className="text-xs font-bold mb-4 text-blue-700 bg-blue-50 p-3 rounded-lg border border-blue-200">{msg}</div>}
      <div className="section-title">CPF (já preenchido)</div>
      <input className="input-box bg-gray-100" value={reg.cpf} disabled />
      <div className="section-title">Tipo de Profissional</div>
      <select className="input-box" value={reg.tipo} onChange={e=>{setReg(prev=>({...prev, tipo:e.target.value})); setTipoSelecionado(e.target.value);}}>
        <option value="acs">Agente Comunitário de Saúde (ACS)</option>
        <option value="tecnico_enfermagem">Técnico de Enfermagem</option>
        <option value="telessaude">Telessaúde</option>
        <option value="equipe_ubs">Profissional de Saúde (Equipe UBS)</option><option value="gerente_unidade">Gerente de Unidade</option><option value="coordenador_ab">Coordenador de Atenção Básica</option>
      </select>
      <div className="section-title">Município</div>
      <select className="input-box" value={PROFISSIONAL_MUNICIPIOS.includes(reg.municipio) || reg.municipio === '' ? reg.municipio : 'Outro'} onChange={e=>{
        const municipio = e.target.value;
        const ubsOptions = municipio ? getUbsByMunicipio(municipio) : [];
        const nextUbs = ubsOptions.length === 1 ? ubsOptions[0] : '';
        setReg(prev => ({ ...prev, municipio, ubs: nextUbs }));
      }}>
        <option value="">Selecione o município...</option>
        {PROFISSIONAL_MUNICIPIOS.map(m => <option key={m} value={m}>{m}</option>)}
        <option value="Outro">Outro</option>
      </select>
      {(reg.municipio === 'Outro' || (reg.municipio && !PROFISSIONAL_MUNICIPIOS.includes(reg.municipio))) && (
        <>
          <div className="section-title">Qual município de atuação?</div>
          <input className="input-box" value={reg.municipio === 'Outro' ? '' : reg.municipio} onChange={e=>setReg(prev => ({ ...prev, municipio: e.target.value, ubs: '' }))} placeholder="Informe o município" />
        </>
      )}
      <div className="section-title">UBS de Atuação</div>
      <select className="input-box" value={getUbsByMunicipio(reg.municipio).includes(reg.ubs) || reg.ubs === '' ? reg.ubs : 'Outro'} onChange={e=>{
        const ubs = e.target.value;
        setReg(prev => ({ ...prev, ubs }));
      }} disabled={!reg.municipio}>
        <option value="">Selecione...</option>
        {getUbsByMunicipio(reg.municipio).map(u => <option key={u} value={u}>{u}</option>)}
        <option value="Outro">Outro</option>
      </select>
      {(reg.ubs === 'Outro' || (reg.ubs && !getUbsByMunicipio(reg.municipio).includes(reg.ubs))) && (
        <>
          <div className="section-title">Qual UBS de atuação?</div>
          <input className="input-box" value={reg.ubs === 'Outro' ? '' : reg.ubs} onChange={e=>setReg(prev => ({ ...prev, ubs: e.target.value }))} placeholder="Informe a UBS" />
        </>
      )}
      <div className="section-title">Seu Nome</div>
      <input className="input-box" value={reg.nome} onChange={e=>setReg(prev => ({ ...prev, nome: e.target.value }))} placeholder="Digite seu nome completo" />
      <div className="section-title">Telefone</div>
      <input className="input-box" value={reg.telefone} onChange={e=>setReg({...reg,telefone:mascaraTelefone(e.target.value)})} placeholder="(91) 98765-4321" inputMode="tel" />
      <button className="btn-primary mt-4" onClick={register}>CONCLUIR CADASTRO</button>
      <button className="btn-sec mt-3" onClick={()=>{setStep('cpf'); setCpf(''); setMsg('');}}>Voltar</button>
    </div>
  );
  
  return (
    <div className="p-6 fade-in pt-20">
      <h2 className="text-2xl font-bold mb-4">Acesso Profissional</h2>
      <p className="text-gray-500 mb-6">Digite seu CPF para entrar</p>
      {msg && <div className="text-xs font-bold mb-4 text-amber-800 bg-amber-50 p-3 rounded-lg border border-amber-200">{msg}</div>}
      <input className="input-box text-center text-xl font-bold" value={cpf} onChange={e=>setCpf(mascaraCPF(e.target.value))} placeholder="000.000.000-00" inputMode="numeric" maxLength={14} />
      <button className="btn-primary mt-4" onClick={checkCpf}>ACESSAR</button>
      <button className="btn-sec mt-3" onClick={onBack}>Voltar</button>
    </div>
  );
};

// Ficha Médica do usuário do SUS
const FichaMedica = ({initialData, onSave, onCancel}) => {
  const defaultFicha = {
    foto_url:'', nome:'', cpf:'', nascimento:'', genero:'', raca:'', endereco:'', telefone:'', escolaridade:'', profissao:'', mora_sozinho:'', mora_companheiro:'', tem_filhos:'', qtd_filhos:'', filhos_json:'', regiao:'', ubs_referencia:'', equipe_ubs:'', acs_responsavel:'', hipertensao:'', tempo_diag_has:'', diabetes:'', tempo_diag_dm:'', gestante:'', infeccao_urinaria_gestacao:'', dependencias:'', tempo_dependencia:'', altura:'', peso_inicial:'', peso_atual:'', peso_primeira_consulta:'', imc_pre_gestacional:'', imc_atual:'', dum:'', gestacao_semanas:'', previsao_parto:'', faz_pre_natal:'', inicio_pre_natal:'', data_ultima_consulta_pre_natal:'', enxerga_bem:'', consulta_oftalmo:'', tempo_consulta_oftalmo:'', dificuldade_mastigar_falar_engolir:'', uso_medicacoes:'', nomes_medicacoes:'', posologia_dosagem:'', posologia_horario:'', data_ultima_prescricao:'', data_ultima_dispensacao:'', atividade_fisica:'', freq_atividade:'', tipo_atividade:'', meta_peso:'', meta_glicemia:'', meta_pa_min:'', meta_pa_max:'', condicoes:''
  };
  const [form, setForm] = useState({ ...defaultFicha, ...(initialData || {}) });
  const [fotoPreview, setFotoPreview] = useState(initialData?.foto_url || '');
  const [fotoFile, setFotoFile] = useState(null);
  const [extraFotos, setExtraFotos] = useState([]);
  const [ubsSearch, setUbsSearch] = useState('');
  const [equipeSearch, setEquipeSearch] = useState('');
  const [acsSearch, setAcsSearch] = useState('');
  const [acsOptions, setAcsOptions] = useState(Array.from(new Set((LISTA_ACS || []).filter(Boolean))).sort((a,b)=>a.localeCompare(b, 'pt-BR')));
  const [medicacoes, setMedicacoes] = useState([{ nome:'', dosagem:'', horario:'', data_prescricao:'', data_dispensacao:'' }]);
  const [saving, setSaving] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const [showCameraFoto, setShowCameraFoto] = useState(false);
  const [showCameraClinica, setShowCameraClinica] = useState(false);
  const cameraVideoRef = useRef(null);
  const cameraStreamRef = useRef(null);
  const cameraClinicaVideoRef = useRef(null);
  const cameraClinicaStreamRef = useRef(null);

  const mascaraHorarioMedicacao = (value) => {
    const digits = String(value || '').replace(/\D/g, '').slice(0, 4);
    if (digits.length <= 2) return digits;
    return `${digits.slice(0, 2)}:${digits.slice(2)}`;
  };

  const horarioValido = (value) => /^([01]\d|2[0-3]):[0-5]\d$/.test(String(value || '').trim());

  const HORARIOS_TEXTO_VALIDOS = ['Manhã', 'Tarde', 'Noite', 'Manhã e Tarde', 'Manhã e Noite', 'Tarde e Noite', 'Manhã, Tarde e Noite', 'Antes da refeição', 'Após a refeição', 'Não se aplica'];
  const horarioAceito = (med) => {
    const h = String(med.horario || '').trim();
    if (!h) return false;
    if (HORARIOS_TEXTO_VALIDOS.includes(h)) return true;
    if (h === 'Horário específico') {
      const esp = String(med.horario_especifico || '').trim();
      return horarioValido(esp);
    }
    return horarioValido(h);
  };

  const normalizarHabitosTexto = (value) => String(value || '')
    .replace(/Problemas com cigarro/g, 'Faz uso de cigarro')
    .replace(/Problemas com álcool/g, 'Faz uso de álcool');
  
  useEffect(() => {
    const normalized = { ...defaultFicha, ...(initialData || {}) };
    normalized.dependencias = normalizarHabitosTexto(normalized.dependencias);
    if(normalized.cpf) normalized.cpf = mascaraCPF(normalized.cpf);
    if(normalized.telefone) normalized.telefone = mascaraTelefone(normalized.telefone);
    let filhosParsed = [];
    try { filhosParsed = normalized.filhos_json ? JSON.parse(normalized.filhos_json) : []; } catch { filhosParsed = []; }
    if (Array.isArray(filhosParsed)) filhosParsed = filhosParsed.filter(f => f?.origem !== 'parto');
    if (Array.isArray(filhosParsed) && filhosParsed.length > 0) {
      normalized.__filhosState = filhosParsed.map(f => ({
        nome: f.nome || '',
        idade: String(f.idade || ''),
        vacinaStatus: f.vacinaStatus || '',
        vacinaData: f.vacinaData || '',
        vacinaAtraso: f.vacinaAtraso || ''
      }));
    }
    setForm(normalized);
    setFotoPreview(normalized.foto_url || '');
    setFotoFile(null);
    setExtraFotos(prev => { prev.forEach(item => { if(item?.preview) URL.revokeObjectURL(item.preview); }); return []; });

    const split = (value) => String(value || '').split('|').map(v => v.trim());
    const nomes = split(normalized.nomes_medicacoes);
    const dosagens = split(normalized.posologia_dosagem);
    const horarios = split(normalized.posologia_horario);
    const maxLen = Math.max(nomes.length, dosagens.length, horarios.length, 1);
    const meds = Array.from({ length: maxLen }).map((_, i) => ({
      nome: nomes[i] || '',
      dosagem: dosagens[i] || '',
      horario: horarios[i] || ''
    }));
    setMedicacoes(meds);
  }, [initialData]);
  
  const hasBasicDataOnly = initialData && initialData.nome && initialData.cpf && !initialData.foto_url && !initialData.genero;
  const isNewPatient = !initialData || (!initialData.nome && !initialData.cpf);
  
  useEffect(() => {
    return () => {
      if(fotoPreview && fotoPreview.startsWith('blob:')) URL.revokeObjectURL(fotoPreview);
      extraFotos.forEach(item => { if(item?.preview) URL.revokeObjectURL(item.preview); });
    };
  }, [fotoPreview, extraFotos]);
  
  const getCondicoesSelecionadas = (source = form.condicoes) => String(source || '').split(',').map(v=>v.trim()).filter(Boolean);
  const isGestacaoAtiva = (source = form) => {
    const condicoes = getCondicoesSelecionadas(source.condicoes);
    return source.gestante === 'Sim' || condicoes.includes('Gestação') || !!source.dum || !!source.gestacao_semanas || !!source.previsao_parto;
  };
  const getRequiredKeys = (source = form) => {
    const keys = [...REQUIRED_KEYS];
    keys.push(isGestacaoAtiva(source) ? 'peso_inicial' : 'peso_atual');
    if (source.atividade_fisica === 'Sim') keys.push('freq_atividade', 'tipo_atividade');
    return keys;
  };
  const isRequiredField = (fieldKey, source = form) => fieldKey && getRequiredKeys(source).includes(fieldKey);
  const gestacaoMarcadaNasCondicoes = getCondicoesSelecionadas().includes('Gestação');
  const gestanteAtiva = isGestacaoAtiva(form);

  const requiredLabel = (label, fieldKey) => {
    const empty = submitted && isRequiredField(fieldKey) && !form[fieldKey];
    return (<div className="section-title flex items-center justify-between"><span>{label} <span className="text-rose-500 font-black">*</span></span>{empty && <span className="text-[11px] font-bold text-rose-500">Preencha este campo</span>}</div>);
  };
  const requiredInputClass = (fieldKey) => submitted && isRequiredField(fieldKey) && !form[fieldKey] ? 'input-box border-2 border-rose-400' : 'input-box';
  const updateField = (key, value) => setForm(prev => ({ ...prev, [key]: value }));
  const setFilhosState = (next) => setForm(prev => ({ ...prev, __filhosState: next }));
  
  const calcularImcPreGestacional = () => {
    const alturaRaw = String(form.altura || '').replace(',', '.');
    const pesoRaw = String(form.peso_inicial || '').replace(',', '.');
    const alturaNum = parseFloat(alturaRaw);
    const pesoNum = parseFloat(pesoRaw);
    if(!alturaNum || !pesoNum) return '';
    const alturaM = alturaNum > 3 ? (alturaNum / 100) : alturaNum;
    if(!alturaM) return '';
    const imc = pesoNum / (alturaM * alturaM);
    return Number.isFinite(imc) ? imc.toFixed(1) : '';
  };

  const calcularImcAtual = () => {
    const alturaRaw = String(form.altura || '').replace(',', '.');
    const pesoRaw = String(form.peso_atual || '').replace(',', '.');
    const alturaNum = parseFloat(alturaRaw);
    const pesoNum = parseFloat(pesoRaw);
    if(!alturaNum || !pesoNum) return '';
    const alturaM = alturaNum > 3 ? (alturaNum / 100) : alturaNum;
    if(!alturaM) return '';
    const imc = pesoNum / (alturaM * alturaM);
    return Number.isFinite(imc) ? imc.toFixed(1) : '';
  };

  const calcularIdadeGestacional = () => {
    const dumStr = String(form.dum || '').trim();
    if (dumStr.length !== 10) return '';
    const partes = dumStr.split('/');
    if (partes.length !== 3) return '';
    const [dd, mm, yyyy] = partes.map(Number);
    const dumDate = new Date(yyyy, mm - 1, dd);
    if (isNaN(dumDate.getTime())) return '';
    const hoje = new Date();
    const diffMs = hoje - dumDate;
    if (diffMs < 0) return '';
    const semanas = Math.floor(diffMs / (1000 * 60 * 60 * 24 * 7));
    return semanas <= 42 ? String(semanas) : '';
  };

  const calcularDPP = () => {
    const dumStr = String(form.dum || '').trim();
    if (dumStr.length !== 10) return '';
    const partes = dumStr.split('/');
    if (partes.length !== 3) return '';
    const [dd, mm, yyyy] = partes.map(Number);
    const dumDate = new Date(yyyy, mm - 1, dd);
    if (isNaN(dumDate.getTime())) return '';
    const dpp = new Date(dumDate);
    dpp.setDate(dpp.getDate() + 280);
    const d = String(dpp.getDate()).padStart(2, '0');
    const m = String(dpp.getMonth() + 1).padStart(2, '0');
    const y = dpp.getFullYear();
    return `${d}/${m}/${y}`;
  };

        <div className="text-xs text-gray-500 font-semibold">Tire fotos (pé, pele, boca, etc.) se necessário.</div>
      </div>
      {showCameraClinica && (
        <div style={{position:'fixed', inset:0, zIndex:9999, background:'#000', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center'}}>
          <video ref={cameraClinicaVideoRef} autoPlay playsInline style={{width:'100%', maxHeight:'70vh', objectFit:'contain'}} />
          <div className="flex gap-4 mt-4">
            <button type="button" onClick={takeFotoClinica} className="w-16 h-16 bg-white rounded-full border-4 border-emerald-500" />
            <button type="button" onClick={closeCameraClinica} className="w-12 h-12 bg-gray-600 rounded-full text-white text-lg">✕</button>
          </div>
        </div>
      )}
      {extraFotos.length > 0 && (
        <div className="flex gap-2 flex-wrap mb-4">
          {extraFotos.map((item, idx) => (<div key={`${item.file.name}-${idx}`} className="border rounded-xl p-2 bg-white"><img src={item.preview} alt="foto" className="w-24 h-24 object-cover rounded-lg" /><button type="button" className="btn-sec w-full mt-2 text-xs" onClick={()=>removerExtraFoto(idx)}>Remover</button></div>))}
        </div>
      )}
      <button className="btn-primary mt-4" onClick={handleSubmit} disabled={saving}>{saving ? 'SALVANDO...' : 'SALVAR PRONTUÁRIO'}</button>
      <button className="btn-sec mt-3" onClick={onCancel}>Voltar</button>
    </div>
  );
};

const EditarPerfilProfissional = ({ user, onSave, onCancel, saving }) => {
  const [form, setForm] = useState({
    nome: user?.nome || user?.enfermeira || '',
    cpf: mascaraCPF(user?.cpf || ''),
    tipo: user?.tipo || 'acs',
    municipio: user?.municipio || '',
    ubs: user?.ubs || '',
    telefone: mascaraTelefone(user?.telefone || ''),
    foto_url: user?.foto_url || ''
  });
  const [preview, setPreview] = useState(user?.foto_url || '');

  const updateField = (key, value) => {
    if (key === 'municipio') {
      const ubsOptions = value ? getUbsByMunicipio(value) : [];
      const nextUbs = ubsOptions.length === 1 ? ubsOptions[0] : '';
      setForm(prev => ({ ...prev, municipio: value, ubs: nextUbs }));
      return;
    }
    setForm(prev => ({ ...prev, [key]: value }));
  };

  const escolherFoto = async (event) => {
    const file = event.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) return alert('Selecione uma imagem válida.');
    if (file.size > 2 * 1024 * 1024) return alert('Selecione uma imagem de até 2MB.');
    try {
      const dataUrl = await fileToDataUrl(file);
      setPreview(dataUrl);
      setForm(prev => ({ ...prev, foto_url: dataUrl }));
    } catch {
      alert('Não foi possível carregar a foto.');
    }
  };

  const salvar = () => {
    if (!form.nome || !form.municipio || !form.ubs || !form.telefone) return alert('Preencha nome, município, UBS e telefone.');
    if (form.municipio === 'Outro') return alert('Informe qual município do profissional.');
    if (form.ubs === 'Outro') return alert('Informe qual UBS do profissional.');
    onSave({ ...form, cpf: String(form.cpf || user?.cpf || '').replace(/\D/g, '') });
  };

  return (
    <div className="p-4 fade-in">
      <div className="flex items-center gap-3 mb-4">
        <button onClick={onCancel} className="btn-sec w-auto px-4 py-2">← Voltar</button>
        <h2 className="text-xl font-bold">Editar meus dados</h2>
      </div>
      <div className="card">
        <div className="flex items-center gap-4 mb-4">
          <div style={{width:76, height:76, borderRadius:'50%', overflow:'hidden', background:'#e8f5e9', border:'2px solid #bbf7d0', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0}}>
            {preview ? <img src={preview} alt="Foto do profissional" style={{width:'100%', height:'100%', objectFit:'cover'}} /> : <img src="../img/logo.png" alt="Tecendo Saúde" style={{width:46, height:46, objectFit:'contain'}} />}
          </div>
          <label className="btn-sec w-auto px-4 py-2" style={{margin:0, cursor:'pointer'}}>
            Alterar foto
            <input type="file" accept="image/*" onChange={escolherFoto} style={{display:'none'}} />
          </label>
        </div>
        <div className="section-title">CPF</div>
        <input className="input-box bg-gray-100" value={form.cpf} disabled />
        <div className="section-title">Tipo de Profissional</div>
        <select className="input-box" value={form.tipo} onChange={e=>updateField('tipo', e.target.value)}>
          <option value="acs">Agente Comunitário de Saúde (ACS)</option>
          <option value="tecnico_enfermagem">Técnico de Enfermagem</option>
          <option value="telessaude">Telessaúde</option>
          <option value="equipe_ubs">Profissional de Saúde (Equipe UBS)</option><option value="gerente_unidade">Gerente de Unidade</option><option value="coordenador_ab">Coordenador de Atenção Básica</option>
        </select>
        <div className="section-title">Nome</div>
        <input className="input-box" value={form.nome} onChange={e=>updateField('nome', e.target.value)} placeholder="Nome completo" />
        <div className="section-title">Município</div>
        <select className="input-box" value={PROFISSIONAL_MUNICIPIOS.includes(form.municipio) || form.municipio === '' ? form.municipio : 'Outro'} onChange={e=>updateField('municipio', e.target.value)}>
          <option value="">Selecione...</option>
          {PROFISSIONAL_MUNICIPIOS.map(m => <option key={m} value={m}>{m}</option>)}
          <option value="Outro">Outro</option>
        </select>
        {(form.municipio === 'Outro' || (form.municipio && !PROFISSIONAL_MUNICIPIOS.includes(form.municipio))) && (
          <>
            <div className="section-title">Qual município do profissional?</div>
            <input className="input-box" value={form.municipio === 'Outro' ? '' : form.municipio} onChange={e=>updateField('municipio', e.target.value)} placeholder="Informe o município" />
          </>
        )}
        <div className="section-title">UBS</div>
        <select className="input-box" value={getUbsByMunicipio(form.municipio).includes(form.ubs) || form.ubs === '' ? form.ubs : 'Outro'} onChange={e=>updateField('ubs', e.target.value)} disabled={!form.municipio}>
          <option value="">Selecione...</option>
          {getUbsByMunicipio(form.municipio).map(u => <option key={u} value={u}>{u}</option>)}
          <option value="Outro">Outro</option>
        </select>
        {(form.ubs === 'Outro' || (form.ubs && !getUbsByMunicipio(form.municipio).includes(form.ubs))) && (
          <>
            <div className="section-title">Qual UBS do profissional?</div>
            <input className="input-box" value={form.ubs === 'Outro' ? '' : form.ubs} onChange={e=>updateField('ubs', e.target.value)} placeholder="Informe a UBS" />
          </>
        )}
        <div className="section-title">Telefone</div>
        <input className="input-box" value={form.telefone} onChange={e=>updateField('telefone', mascaraTelefone(e.target.value))} placeholder="(91) 98765-4321" inputMode="tel" />
        <button className="btn-primary mt-4" onClick={salvar} disabled={saving}>{saving ? 'SALVANDO...' : 'SALVAR ALTERAÇÕES'}</button>
      </div>
    </div>
  );
};
// Dashboard do Profissional
const ProDash = ({user, onLogout, initialMode, initialFormData, onUserUpdate}) => {
  const [mode, setMode] = React.useState(initialMode || 'menu');
  const [formData, setFormData] = useState(initialFormData || {});
  const [saving, setSaving] = useState(false);
  const [profissional, setProfissional] = useState(user || {});
  useEffect(() => { setProfissional(user || {}); }, [user]);
  useEffect(() => { sessionStorage.setItem('profissional', JSON.stringify(profissional || {})); }, [profissional]);

  const tipoAtual = profissional?.tipo || 'acs';
  const tipoLabel = tipoProfissionalLabel(tipoAtual);
  const tipoCor = tipoProfissionalStyle(tipoAtual);
  const podeGerenciarUsuarios = typeof window.podeGerenciarCadastrosProfissional === 'function' && window.podeGerenciarCadastrosProfissional(profissional);

  const saveForm = async (f, extraFiles = []) => {
    setSaving(true);
    try {
      const clean = f.cpf.replace(/\D/g,'');
      const profNome = profissional?.enfermeira || profissional?.nome || 'Profissional';
      const payload = { ...f, patient_id: 'cpf-' + clean, cpf: clean, created_by_nome: profNome, created_by_ubs: profissional?.ubs || '', created_by_cpf: profissional?.cpf || '', updated_at: new Date().toISOString() };
      const { error } = await supabase.from('perfis').upsert(payload, { onConflict: 'patient_id' });
      if(error && payload.condicoes){ const fallback = { ...payload }; delete fallback.condicoes; const { error: retryError } = await supabase.from('perfis').upsert(fallback, { onConflict: 'patient_id' }); if(retryError) throw retryError; }
      else if(error) { throw error; }

      const splitPipe = (value) => String(value || '').split('|').map(v => v.trim());
      const toDateISO = (value) => {
        const raw = String(value || '').trim();
        const m = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
        if (!m) return null;
        return `${m[3]}-${m[2]}-${m[1]}`;
      };
      const usoMedicacoes = ['sim', 's', 'true', '1'].includes(String(payload.uso_medicacoes || '').trim().toLowerCase());
      const nomes = splitPipe(payload.nomes_medicacoes);
      const dosagens = splitPipe(payload.posologia_dosagem);
      const horarios = splitPipe(payload.posologia_horario);
      const maxLen = Math.max(nomes.length, dosagens.length, horarios.length, 0);
      const medicamentos = [];
      for (let i = 0; i < maxLen; i += 1) {
        const nome = nomes[i] || '';
        const dosagem = dosagens[i] || '';
        const horario = horarios[i] || '';
        if (!nome && !dosagem && !horario) continue;
        medicamentos.push({
          medication_id: uuidv4(), patient_id: payload.patient_id, nome_paciente: payload.nome || null,
          cpf_paciente: payload.cpf || null, tipo_medicamento: null, nome_medicamento: nome || null,
          dosagem: dosagem || null, horarios: horario || null,
          data_prescricao: toDateISO(prescricoes[i]), data_dispensacao: toDateISO(dispensacoes[i]),
          data_inicio: null, data_termino: null, ativo: usoMedicacoes ? 'sim' : 'nao', synced: 1
        });
      }

      const { error: delMedsError } = await supabase.from('medicamentos').delete().eq('patient_id', payload.patient_id);
      if (delMedsError) throw delMedsError;
      if (usoMedicacoes && medicamentos.length > 0) {
        const { error: insMedsError } = await supabase.from('medicamentos').insert(medicamentos);
        if (insMedsError) throw insMedsError;
      }

      if (extraFiles && extraFiles.length > 0) {
        const registroId = uuidv4();
        const now = new Date().toISOString();
        const media = [];
        for (let i = 0; i < extraFiles.length; i += 1) {
          const file = extraFiles[i];
          const safeName = (file?.name || `foto_${i}.jpg`).replace(/[^a-zA-Z0-9.]/g,'_');
          const path = `${registroId}/pro/${Date.now()}_${i}_${safeName}`;
          const { error: upErr } = await supabase.storage.from('midias').upload(path, file, { upsert: true, contentType: file.type });
          if (!upErr) { const { data } = supabase.storage.from('midias').getPublicUrl(path); if (data?.publicUrl) media.push({ type: file.type, url: data.publicUrl, path }); }
        }
        if (media.length > 0) {
          const replies = [{ from: 'pro', pro_name: profNome, pro_ubs: profissional?.ubs || '', text: '📎 Fotos clínicas enviadas no cadastro.', media, at: now }];
          await supabase.from('registros').upsert({ registro_id: registroId, patient_id: payload.patient_id, device_id: 'pro', texto: 'Fotos clínicas enviadas no cadastro.', tipo: 'cadastro', status: 'respondido', replies_json: replies, created_at: now, updated_at: now }, { onConflict: 'registro_id' });
        }
      }
      alert('✅ Usuário do SUS cadastrado com sucesso!');
      setMode('menu');
    } catch(err) { console.error('Erro ao salvar:', err); alert('❌ Erro ao salvar: ' + (err.message || 'Tente novamente')); } finally { setSaving(false); }
  };

  const savePerfilProfissional = async (dados) => {
    setSaving(true);
    try {
      const cpfClean = String(dados.cpf || profissional?.cpf || '').replace(/\D/g, '');
      if (!cpfClean) return alert('CPF do profissional não encontrado.');
      const payload = { nome: dados.nome, cpf: cpfClean, municipio: dados.municipio, ubs: dados.ubs, telefone: dados.telefone, tipo: dados.tipo || 'acs', foto_url: dados.foto_url || '', updated_at: new Date().toISOString() };
      let { data, error } = await supabase.from('profissionais').update(payload).eq('cpf', cpfClean).select().maybeSingle();
      if (error) {
        const fallback = { ...payload }; delete fallback.foto_url; delete fallback.updated_at;
        const retry = await supabase.from('profissionais').update(fallback).eq('cpf', cpfClean).select().maybeSingle();
        data = retry.data; error = retry.error;
      }
      if (error) throw error;
      const atualizado = { ...profissional, ...(data || payload), foto_url: payload.foto_url, tipo: (data?.tipo || payload.tipo || profissional?.tipo || 'acs') };
      setProfissional(atualizado);
      sessionStorage.setItem('profissional', JSON.stringify(atualizado));
      if (typeof onUserUpdate === 'function') onUserUpdate(atualizado);
      alert('✅ Cadastro profissional atualizado!');
      setMode('menu');
    } catch (err) { console.error('Erro ao atualizar profissional:', err); alert('❌ Erro ao atualizar: ' + (err.message || 'tente novamente')); }
    finally { setSaving(false); }
  };

  const abrirMonitoramento = () => { window.location.href = '../monitoramento/monitoramento.html'; };

  let content = null;
  if(mode === 'menu') {
    content = (
      <div className="p-6 fade-in">
        <div className="flex justify-between items-center mb-8">
          <div>
            <h2 className="text-xl font-bold flex items-center gap-2" style={{color:'var(--primary)'}}><img src={profissional?.foto_url || "../img/logo.png"} alt="Profissional" className="w-8 h-8 rounded-full" style={{objectFit:'cover'}} />{profissional?.enfermeira || profissional?.nome}</h2>
            <p className="text-gray-500 text-sm">{profissional?.ubs} • {profissional?.municipio}</p>
            <span style={{display:'inline-block', marginTop:'4px', padding:'3px 10px', borderRadius:'20px', fontSize:'11px', fontWeight:800, background: tipoCor.bg, color: tipoCor.color}}>Profissional {tipoLabel}</span>
          </div>
          <button onClick={onLogout} className="text-red-500 font-bold text-sm">SAIR</button>
        </div>
        <div className="grid gap-4">
          <button className="big-btn" onClick={() => { setFormData({}); setMode('novo_cadastro'); }} style={{transition:'all 0.3s', border:'2px solid transparent'}} onMouseOver={e=>e.currentTarget.style.borderColor='var(--primary)'} onMouseOut={e=>e.currentTarget.style.borderColor='transparent'}>
            <div className="big-btn-icon">📝</div><div className="font-bold text-lg">Novo Cadastro</div><div className="text-gray-400 text-sm">Cadastrar novo usuário do SUS</div>
          </button>
          <button className="big-btn" onClick={() => setMode('editar_profissional')} style={{transition:'all 0.3s', border:'2px solid transparent'}} onMouseOver={e=>e.currentTarget.style.borderColor='var(--primary)'} onMouseOut={e=>e.currentTarget.style.borderColor='transparent'}>
            <div className="big-btn-icon" style={{background:'#fef3c7'}}>👤</div><div className="font-bold text-lg">Editar meus dados</div><div className="text-gray-400 text-sm">Atualizar telefone, UBS, tipo e foto</div>
          </button>
          {podeGerenciarUsuarios && (
            <button className="big-btn" onClick={() => setMode('gestao_usuarios')} style={{transition:'all 0.3s', border:'2px solid transparent'}} onMouseOver={e=>e.currentTarget.style.borderColor='var(--primary)'} onMouseOut={e=>e.currentTarget.style.borderColor='transparent'}>
              <div className="big-btn-icon" style={{background:'#ede9fe'}}>🗂️</div><div className="font-bold text-lg">Gerenciar Usuários</div><div className="text-gray-400 text-sm">Usuários do SUS e profissionais</div>
            </button>
          )}          <button className="big-btn" onClick={abrirMonitoramento} style={{transition:'all 0.3s', border:'2px solid transparent'}} onMouseOver={e=>e.currentTarget.style.borderColor='var(--primary)'} onMouseOut={e=>e.currentTarget.style.borderColor='transparent'}>
            <div className="big-btn-icon" style={{background:'#dbeafe'}}>📊</div><div className="font-bold text-lg">Monitoramento</div><div className="text-gray-400 text-sm">Dashboard de acompanhamento</div>
          </button>
        </div>
      </div>
    );
  } else if (mode === 'editar_profissional') {
    content = <EditarPerfilProfissional user={profissional} saving={saving} onSave={savePerfilProfissional} onCancel={() => setMode('menu')} />;
  } else if (mode === 'gestao_usuarios') {
    content = <GestaoCoordenador profissional={profissional} onBack={() => setMode('menu')} />;
  } else if (mode === 'novo_cadastro') {
    content = (
      <div className="p-4 fade-in">
        <div className="flex items-center gap-3 mb-4">
          <button onClick={()=>setMode('menu')} style={{padding:'10px 22px',borderRadius:'30px',border:'1.5px solid var(--primary)',background:'#fff',color:'var(--primary)',fontWeight:700,fontSize:'15px',cursor:'pointer',display:'flex',alignItems:'center',gap:'6px',boxShadow:'0 2px 8px rgba(47,107,63,0.10)',transition:'all 0.2s'}} onMouseEnter={e=>{e.currentTarget.style.background='var(--primary)';e.currentTarget.style.color='#fff';e.currentTarget.style.boxShadow='0 4px 14px rgba(47,107,63,0.30)';}} onMouseLeave={e=>{e.currentTarget.style.background='#fff';e.currentTarget.style.color='var(--primary)';e.currentTarget.style.boxShadow='0 2px 8px rgba(47,107,63,0.10)';}} onMouseDown={e=>e.currentTarget.style.transform='scale(0.96)'} onMouseUp={e=>e.currentTarget.style.transform='scale(1)'}>← Voltar</button>
          <h2 className="text-xl font-bold">Ficha do Usuário do SUS</h2>
        </div>
        <div className="card"><FichaMedica initialData={formData} onSave={saveForm} onCancel={()=>setMode('menu')} /></div>
      </div>
    );
  }
  return <>{content}</>;
};
// App principal do Profissional
const ProfissionalApp = () => {
  const [route, setRoute] = useState('login');
  const [user, setUser] = useState(null);
  const [online, setOnline] = useState(navigator.onLine);

  useEffect(() => { const f = () => setOnline(navigator.onLine); window.addEventListener('online', f); window.addEventListener('offline', f); return () => { window.removeEventListener('online', f); window.removeEventListener('offline', f); }; }, []);

  const [autoCadastroData, setAutoCadastroData] = useState(null);

  useEffect(() => {
    const raw = sessionStorage.getItem('profissional');
    if (raw) { try { const prof = JSON.parse(raw); if (prof) { setUser(prof); setRoute('dash'); return; } } catch (e) { } }
    // Handle ?autocadastro=1 from patient login redirect
    const params = new URLSearchParams(window.location.search);
    if (params.get('autocadastro') === '1') {
      const proRaw = sessionStorage.getItem('autocadastro_pro');
      if (proRaw) {
        try {
          const pro = JSON.parse(proRaw);
          sessionStorage.removeItem('autocadastro_pro');
          setUser(pro);
          setAutoCadastroData({ cpf: mascaraCPF(pro.cpf || ''), nome: pro.nome || '', telefone: pro.telefone || '', ubs_referencia: pro.ubs || '' });
          setRoute('dash');
          window.history.replaceState({}, '', window.location.pathname);
        } catch {}
      }
    }
  }, []);

  const loginPro = (data) => { setUser(data); setRoute('dash'); };
  const logout = () => { sessionStorage.removeItem('profissional'); sessionStorage.removeItem('autocadastro_pro'); setUser(null); setRoute('login'); };

  if(SUPABASE_CONFIG_MISSING) return (
    <div className="flex flex-col items-center justify-center min-h-screen p-6 fade-in text-center">
      <img src="../img/logo.png" alt="Tecendo Saúde" className="w-36 h-36 mb-6" />
      <h1 className="text-2xl font-extrabold text-green-900 mb-2">Configuração necessária</h1>
      <p className="text-gray-600 mb-4">Configure o arquivo env/env.js com SUPABASE_URL e SUPABASE_KEY.</p>
    </div>
  );

  return (
    <>
      <OfflineBanner online={online} />
      {route === 'login' && <ProAuth onAuth={loginPro} onBack={() => window.location.href = '../index.html'} />}
      {route === 'dash' && <ProDash user={user} onLogout={logout} initialMode={autoCadastroData ? 'novo_cadastro' : undefined} initialFormData={autoCadastroData || undefined} onUserUpdate={setUser} />}
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<ProfissionalApp />);
</script>
</body>
