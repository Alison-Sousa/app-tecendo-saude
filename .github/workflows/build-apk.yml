name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Cordova project structure
        run: |
          npm install -g cordova@12.0.0
          mkdir -p cordova-build
          cd cordova-build
          cordova create app br.com.tecendosaude "Tecendo Saude"
          cd app
          cordova plugin add cordova-plugin-local-notification --variable ANDROIDX_CORE_VERSION=1.12.0
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-dialogs

      - name: Copy web files into Cordova www
        run: |
          rm -rf cordova-build/app/www/*
          cp -r index.html sw.js audios/ database/ img/ js/ monitoramento/ profissionais/ styles/ usuarios/ cordova-build/app/www/
          mkdir -p cordova-build/app/www/env

      - name: Generate env.js from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node env/build-env.js
          cp env/env.js cordova-build/app/www/env/env.js

      - name: Configure Cordova for Android
        run: |
          cd cordova-build/app
          # Replace config.xml with project config
          cat > config.xml << 'XMLEOF'
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="br.com.tecendosaude" version="1.0.1" xmlns="http://www.w3.org/ns/widgets" xmlns:android="http://schemas.android.com/apk/res/android">
              <name>Tecendo Saude</name>
              <description>Aplicativo de Saúde</description>
              <author email="seu-email@dominio.com">Tecendo Saude</author>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <preference name="android-minSdkVersion" value="24" />
              <preference name="android-targetSdkVersion" value="34" />
              <preference name="android-compileSdkVersion" value="34" />
              <platform name="android">
                  <icon src="www/img/logo.png" />
                  <config-file target="AndroidManifest.xml" parent="/*">
                      <uses-permission android:name="android.permission.RECORD_AUDIO" />
                      <uses-permission android:name="android.permission.CAMERA" />
                      <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
                      <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                      <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
                      <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
                      <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
                      <uses-permission android:name="android.permission.WAKE_LOCK" />
                      <uses-permission android:name="android.permission.VIBRATE" />
                      <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                  </config-file>
                  <preference name="AndroidWindowSplashScreenAnimatedIcon" value="www/img/logo.png" />
                  <preference name="AndroidWindowSplashScreenBackground" value="#FFFFFF" />
              </platform>
          </widget>
          XMLEOF
          cordova platform add android@13.0.0

      - name: Fix Gradle build for Android 34
        run: |
          ANDROID_DIR="cordova-build/app/platforms/android"

          # Ensure cdv-gradle-config.json has correct SDK values
          echo '{
            "MIN_SDK_VERSION": 24,
            "SDK_VERSION": 34,
            "COMPILE_SDK_VERSION": 34,
            "TARGET_SDK_VERSION": 34,
            "IS_GRADLE_PLUGIN_KOTLIN_ENABLED": false,
            "PACKAGE_NAMESPACE": "br.com.tecendosaude"
          }' > "$ANDROID_DIR/cdv-gradle-config.json"

          # Fix compileSdk in all gradle files (handles both old and new syntax)
          for f in "$ANDROID_DIR/app/build.gradle" "$ANDROID_DIR/CordovaLib/build.gradle" "$ANDROID_DIR/build.gradle"; do
            if [ -f "$f" ]; then
              # Replace cordovaConfig property references with literal values
              sed -i 's/cordovaConfig\.SDK_VERSION/34/g' "$f"
              sed -i 's/cordovaConfig\.COMPILE_SDK_VERSION/34/g' "$f"
              sed -i 's/cordovaConfig\.TARGET_SDK_VERSION/34/g' "$f"
              sed -i 's/cordovaConfig\.MIN_SDK_VERSION/24/g' "$f"
              sed -i 's/cordovaConfig\.MAX_SDK_VERSION/34/g' "$f"
              sed -i "s/cordovaConfig\.PACKAGE_NAMESPACE/'br.com.tecendosaude'/g" "$f"
              sed -i 's/cordovaConfig\.IS_GRADLE_PLUGIN_KOTLIN_ENABLED/false/g' "$f"
              # Replace literal SDK numbers
              sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' "$f"
              sed -i 's/compileSdk [0-9]*/compileSdk 34/g' "$f"
              sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' "$f"
              sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' "$f"
            fi
          done

          # Debug: show key lines of app/build.gradle
          echo "=== app/build.gradle (first 40 lines) ==="
          head -40 "$ANDROID_DIR/app/build.gradle" || true
          echo "=== cdv-gradle-config.json ==="
          cat "$ANDROID_DIR/cdv-gradle-config.json" || true

      - name: Build APK
        working-directory: cordova-build/app
        run: cordova build android

      - name: Prepare APK for release
        run: |
          APK=$(find cordova-build/app/platforms/android -name "*.apk" | head -1)
          cp "$APK" tecendo-saude.apk
          echo "APK_SIZE=$(du -h tecendo-saude.apk | cut -f1)" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Tecendo Saúde v1.0.${{ github.run_number }}"
          body: |
            📱 **APK gerado automaticamente**
            Tamanho: ${{ env.APK_SIZE }}

            **Como instalar no Android:**
            1. Baixe `tecendo-saude.apk`
            2. Abra no celular
            3. Permita instalação de fontes desconhecidas
            4. Instale!
          files: tecendo-saude.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
