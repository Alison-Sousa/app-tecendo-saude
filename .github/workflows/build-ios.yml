name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Cordova project structure
        run: |
          npm install -g cordova
          mkdir -p cordova-build
          cd cordova-build
          cordova create app br.com.tecendosaude "Tecendo Saude"
          cd app
          cordova plugin add cordova-plugin-local-notification
          cordova plugin add cordova-plugin-dialogs

      - name: Copy web files into Cordova www
        run: |
          rm -rf cordova-build/app/www/*
          cp -r index.html audios/ database/ img/ js/ monitoramento/ profissionais/ styles/ textos/ usuarios/ cordova-build/app/www/
          mkdir -p cordova-build/app/www/env

      - name: Generate env.js from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node env/build-env.js
          cp env/env.js cordova-build/app/www/env/env.js

      - name: Configure Cordova for iOS
        run: |
          cd cordova-build/app
          cat > config.xml << 'XMLEOF'
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="br.com.tecendosaude" version="1.0.1" xmlns="http://www.w3.org/ns/widgets">
              <name>Tecendo Saude</name>
              <description>Aplicativo de Saúde</description>
              <author email="seu-email@dominio.com">Tecendo Saude</author>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <platform name="ios">
                  <icon src="www/img/logo.png" width="1024" height="1024" />
                  <preference name="StatusBarOverlaysWebView" value="false" />
                  <preference name="StatusBarStyle" value="default" />
              </platform>
          </widget>
          XMLEOF
          cordova platform add ios

      - name: Build iOS (no codesign)
        working-directory: cordova-build/app
        run: |
          cordova build ios --buildFlag="-allowProvisioningUpdates" --buildFlag="CODE_SIGNING_ALLOWED=NO" --buildFlag="CODE_SIGN_IDENTITY=" --buildFlag="CODE_SIGNING_REQUIRED=NO"

      - name: Create IPA from .app
        run: |
          APP_PATH=$(find cordova-build/app/platforms/ios/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app not found"
            exit 1
          fi
          echo "Found .app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r tecendo-saude.ipa Payload
          echo "IPA_SIZE=$(du -h tecendo-saude.ipa | cut -f1)" >> $GITHUB_ENV

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tecendo-saude-ios
          path: tecendo-saude.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v1.0.${{ github.run_number }}
          name: "Tecendo Saúde iOS v1.0.${{ github.run_number }}"
          body: |
            📱 **IPA gerado automaticamente (sem assinatura Apple)**
            Tamanho: ${{ env.IPA_SIZE }}

            ⚠️ Este .ipa NÃO tem assinatura Apple.
            Serve para:
            - Testes em simulador
            - Sideload com AltStore / Sideloadly
            - Distribuição alternativa

            **Para instalar via sideload:**
            1. Baixe `tecendo-saude.ipa`
            2. Use AltStore ou Sideloadly no computador
            3. Conecte o iPhone via USB
            4. Instale o .ipa pelo app
          files: tecendo-saude.ipa
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
